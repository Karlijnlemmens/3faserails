<style>
  /* Palet, tabbladenrij en focusring staan in suite-stijl.css. */
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}

  h2.section-title{font-size:20px; margin:0 0 4px; color:var(--navy-900);}
  .eyebrow{font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--blue-dark); margin-bottom:4px; display:block; font-weight:600;}
  .card{
