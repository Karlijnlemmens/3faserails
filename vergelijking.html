<!DOCTYPE html>
<html lang="nl">
<head>
<!-- Gegenereerd door vergelijker/bouw-tool.py — niet met de hand aanpassen.
     Aanpassen doe je in vergelijker/index-template.html; draai daarna opnieuw. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armatuurvergelijker — Distrilight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0E6FB0; --blue-dark:#0A4E7C; --blue-soft:#E8F2F9; --blue-line:#BBD7EA;
  --orange:#F5821F; --orange-soft:#FDF0E2;
  --ink:#1B2733; --muted:#6B7B8A; --line:#DCE5EC; --bg:#F4F7FA; --white:#fff;
  --ok:#2E9E5B; --warn:#C9721A; --err:#C0392B;
  --r:10px; --rail:264px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}

/* ---------- suite-koptekst: navigatie tussen de Distrilight-tools ----------
   Zelfde opmaak als op de andere pagina's van de suite. Bewust met vaste
   kleuren opgeschreven: de tool heeft zijn eigen --blue en die is anders. */
.suite{background:#fff;border-top:5px solid #3E8EDE;border-bottom:1px solid #DCE6F2;
  padding:12px 20px 8px;display:flex;align-items:center;justify-content:space-between;
  gap:10px;flex-wrap:wrap}
.suite-logo{height:100px;width:auto;display:block;transform:translateX(-7.65%)}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{border:1px solid #EAF3FC;background:#EAF3FC;color:#2C72BA;font-size:11px;
  padding:3px 10px;border-radius:999px;font-family:'JetBrains Mono',ui-monospace,monospace;
  letter-spacing:.03em;font-weight:600;text-decoration:none;display:inline-block;transition:.12s}
.badge:hover{border-color:#3E8EDE}
.badge.active{background:#3E8EDE;border-color:#3E8EDE;color:#fff}

/* ---------- header ---------- */
.top{background:var(--blue-dark);color:#fff;padding:10px 20px;display:flex;
  align-items:center;gap:18px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:17px;letter-spacing:-.2px}
.brand span{color:var(--orange)}
.top .spacer{flex:1}
.projbar{background:var(--white);border-bottom:1px solid var(--line);padding:10px 20px;
  display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.f.sm input{width:110px}
.f.xs input{width:74px}

/* ---------- pills ---------- */
.pill{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:999px;
  padding:6px 15px;font-weight:700;cursor:pointer;font-size:13px}
.pill:hover{background:var(--blue-soft)}
.pill.solid{background:var(--blue);color:#fff}
.pill.solid:hover{background:var(--blue-dark)}
.pill.ghost{border-color:var(--line);color:var(--muted)}
.pill.ghost:hover{background:var(--bg);color:var(--ink)}
.pill.acc{border-color:var(--orange);color:var(--orange)}
.pill.acc:hover{background:var(--orange-soft)}
.pill:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:var(--rail) 1fr;gap:0;align-items:start}
.rail{background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 96px);padding:14px 12px;
  position:sticky;top:96px;max-height:calc(100vh - 96px);overflow:auto}
.rail h2{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 8px 4px}
.poslist{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:4px}
.posbtn{width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;
  padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:9px}
.posbtn:hover{background:var(--bg)}
.posbtn.on{background:var(--blue-soft);border-color:var(--blue-line)}
.posbtn .code{font-weight:800;min-width:34px}
.posbtn .art{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.done{background:var(--ok)} .dot.part{background:var(--orange)}
.main{padding:18px 22px 60px;max-width:1180px}

/* ---------- comparison sheet ---------- */
/* overflow:visible, anders knipt het blad de keuzelijst van de familiekiezer af.
   De ronde hoeken zitten daarom op de kop en op het keuzeblok zelf. */
.sheet{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:visible}
.sheet-head{background:var(--blue);color:#fff;display:grid;grid-template-columns:170px 1fr 1fr;
  align-items:center;padding:9px 14px;gap:14px;border-radius:var(--r) var(--r) 0 0}
.sheet-head b{font-size:15px}
.sheet-head .h{font-weight:800;font-size:13px}
.row{display:grid;grid-template-columns:170px 1fr 1fr;gap:14px;padding:7px 14px;border-top:1px solid var(--line);align-items:start}
.row:nth-child(odd){background:#FBFDFE}
.row .lbl{color:var(--blue);font-weight:700;font-size:12.5px;padding-top:6px}
.row input,.row select,.row textarea{width:100%;border:1px solid transparent;background:transparent;
  border-radius:6px;padding:5px 7px}
.row input:hover,.row textarea:hover{border-color:var(--line);background:#fff}
.row input:focus,.row select:focus,.row textarea:focus{border-color:var(--blue);background:#fff;outline:none}
.row textarea{resize:vertical;min-height:32px}
.auto{background:var(--blue-soft)!important;border-color:var(--blue-line)!important}
.edited{background:var(--orange-soft)!important;border-color:var(--orange)!important}
.cel{display:flex;flex-direction:column;gap:3px}
.hint{font-size:11px;color:var(--muted);padding:0 7px}
.hint.warn{color:var(--warn);font-weight:700}
.hint.err{color:var(--err);font-weight:700}

.picker{background:var(--blue-soft);border-top:1px solid var(--blue-line);padding:11px 14px;
  display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;border-radius:0 0 var(--r) var(--r)}
.picker .f select,.picker .f input{background:#fff}

/* ---------- fotovakken ---------- */
.foto-cel{display:flex;flex-direction:column;gap:6px}
.fotovak{position:relative;border:1px dashed var(--line);border-radius:8px;background:#fff;min-height:112px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:10px;cursor:pointer;text-align:center}
.fotovak:hover,.fotovak:focus-visible{border-color:var(--blue);background:var(--blue-soft);outline:none}
/* Het vak dat Ctrl+V vangt. Met twee vakken moet zichtbaar zijn waar je plakt. */
.fotovak.doel{border-color:var(--blue);border-style:solid;box-shadow:0 0 0 3px var(--blue-soft)}
.fotovak-doelmerk{position:absolute;top:5px;right:6px;font-size:10px;font-weight:800;
  letter-spacing:.04em;color:#fff;background:var(--blue);border-radius:999px;padding:1px 7px}
.fotovak-bron{font-size:10.5px;color:var(--muted)}
.fotovak.sleep{border-color:var(--orange);background:var(--orange-soft)}
.fotovak.gevuld{border-style:solid;padding:6px;cursor:default;background:#fff}
.fotovak img,.foto-onze img{max-width:100%;max-height:190px;object-fit:contain;display:block}
.fotovak-uitleg{font-size:12.5px;font-weight:700}
.fotovak-hoe{font-size:11px;color:var(--muted);line-height:1.4}
.foto-knoppen{display:flex;gap:7px}
.foto-knoppen .pill{padding:2px 11px;font-size:11.5px}
.foto-onze{border:1px solid var(--line);border-radius:8px;background:#fff;min-height:112px;
  display:flex;align-items:center;justify-content:center;padding:6px}
.foto-onze.leeg{border-style:dashed;font-size:11.5px;color:var(--muted);text-align:center;padding:10px}

/* ---------- familiekiezer: typen of kiezen ---------- */
.fam{position:relative}
.fam input{min-width:300px}
.fam-lijst{position:absolute;top:100%;left:0;z-index:30;min-width:100%;width:max-content;
  max-width:440px;background:#fff;border:1px solid var(--blue-line);border-radius:9px;
  margin-top:4px;padding:4px;max-height:290px;overflow:auto;
  box-shadow:0 10px 26px rgba(16,44,66,.16)}
.fam-lijst[hidden]{display:none}
.fam-op{padding:6px 9px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.fam-op:hover,.fam-op.aan{background:var(--blue-soft)}
.fam-op b{font-size:13.5px;font-weight:700}
.fam-op span{font-size:11.5px;color:var(--muted)}
.fam-op.leeg b{font-weight:400;color:var(--muted)}
.fam-niets{padding:9px;font-size:12.5px;color:var(--muted)}
.counts{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}

.paste{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.paste-kop{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.paste-kop .hint{padding:0}
.paste-ta{width:100%;min-height:150px;margin-top:11px;border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:12px;resize:vertical}
.paste-ta:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.paste-knoppen{margin-top:9px;display:flex;gap:9px}
.paste-res{margin-top:13px;border-top:1px solid var(--line);padding-top:11px}
.paste-sub{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
  color:var(--muted);margin:9px 0 5px}
.paste-rij{display:grid;grid-template-columns:190px 1fr;gap:10px;padding:3px 0;font-size:13px}
.paste-veld{color:var(--blue);font-weight:700}
.paste-waarde{color:var(--ink)}
.paste-onb{margin-top:9px;font-size:12px;color:var(--muted)}
.paste-onb summary{cursor:pointer;font-weight:700}
.paste-res .pill.solid{margin-top:12px}
.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar h1{font-size:19px;margin:0 10px 0 0}
.note{background:var(--orange-soft);border:1px solid var(--orange);border-radius:8px;
  padding:9px 12px;margin-bottom:14px;font-size:13px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:5px}
.tag{display:inline-block;background:var(--blue-soft);color:var(--blue-dark);border-radius:999px;
  padding:1px 9px;font-size:11px;font-weight:700}
.tag.g{background:#E6F5EC;color:#1F7A45}
.tag.o{background:var(--orange-soft);color:#A85E12}
.hidden{display:none!important}

/* ---------- pdf-voorbeeld ---------- */
.pdfprev{position:fixed;inset:0;z-index:100;background:rgba(8,24,38,.92);
  display:flex;flex-direction:column;padding:18px 22px 22px}
.pdfprev-kop{display:flex;gap:9px;align-items:center;margin-bottom:11px;color:#fff}
.pdfprev-kop b{flex:1;font-size:16px}
.pdfprev-kop .pill{background:#fff}
.pdfprev iframe{flex:1 1 auto;width:100%;border:0;border-radius:8px;background:#fff}
.pdfprev-melding{background:var(--orange-soft);border:1px solid var(--orange);color:#8A4E0C;
  border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12.5px}
.pdfprev-bezig{color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;flex:1}

@media print{
  .suite,.top,.projbar,.rail,.bar,.picker,.hint{display:none!important}
  .wrap{display:block}.main{padding:0;max-width:none}
  .sheet{page-break-after:always;border:none}
  .row input,.row textarea,.row select{border:none!important;background:none!important}
}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.rail{position:static;max-height:none;min-height:0}
  .row,.sheet-head{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ======================= state ======================= */
const S = {
  project:{nr:'',naam:'',inst:'',datum:'',lagen:['BG'],type:'nieuwbouw'},
  posities:[], actief:0
};
const REF_VELDEN = [
  ['leverancier','Leverancier'],['type','Type'],['artikelnummer','Artikelnummer'],
  ['omschrijving','Omschrijving'],['toepassing','Toepassing'],['vermogen','Vermogen'],
  ['cct','Kleurtemperatuur'],['lumen','Nuttige lichtstroom'],['dimbaar','Dimbaar'],
  ['afmetingen','Afmetingen']
];
const KENMERKEN = [['uitvoering','Uitvoering'],['kleur','Kleur'],['wattage','Wattage'],
                   ['driver','Driver'],['sensor','Sensor'],['noodverlichting','Noodverlichting']];

/* Wattage staat niet als los veld in de data maar als bereik in vermogen_w.
   Voor de keuzebalk maken we er een korte tekst van: 15W, of 11-19W als het
   een bereik is. Staat er alleen een bovengrens (de ondergrens hangt dan van
   de driver af), dan is dat getal het wattage waar iedereen het over heeft. */
function wattLabel(v){
  const w = v && v.vermogen_w;
  if(!w) return '';
  const kort = x => String(Number(x));
  if(w.min==null && w.max==null) return '';
  if(w.min==null) return kort(w.max)+'W';
  if(w.max==null || w.min===w.max) return kort(w.min)+'W';
  return kort(w.min)+'-'+kort(w.max)+'W';
}
const KENMERK_AFLEIDING = {wattage: wattLabel};

/* De waarde van een kenmerk: uit het veld, of afgeleid als het geen veld is. */
function kenmerkVan(v,key){
  if(!v) return null;
  const afleiden = KENMERK_AFLEIDING[key];
  if(!afleiden) return v[key];
  const w = afleiden(v);
  return (w===''||w==null) ? null : w;
}

/* Waarden die met een getal beginnen op getal sorteren: 6W hoort voor 15W,
   en alfabetisch zou 15W eerst zetten. */
function sorteerKenmerk(waarden){
  if(!waarden.every(w=>/^\d/.test(String(w)))) return waarden;
  return waarden.slice().sort((a,b)=>parseFloat(a)-parseFloat(b));
}

function nieuwePositie(code){
  return {code:code||volgendeCode(), aantallen:{}, bestaandeZaagmaat:'',
          ref:{}, fotoRef:'', fotoOns:'', familieId:'', artikelcode:'', overrides:{}, opmerking:''};
}
function volgendeCode(){
  const g=['A','B','C','D','E','F','G','H','J','K','L','M'];
  const used=new Set(S.posities.map(p=>p.code));
  return g.find(c=>!used.has(c)) || 'X'+(S.posities.length+1);
}

/* ======================= variantkeuze ======================= */
function grootte(v){
  if(v.buitenmaat_mm) return v.buitenmaat_mm;
  if(v.lengte_cm) return v.lengte_cm*10;
  if(v.afmetingen_mm) return (v.afmetingen_mm.l||0)*(v.afmetingen_mm.b||1)/100;
  return 99999;
}
function zaagmaatVan(v){
  if(typeof v.zaagmaat_mm==='number') return v.zaagmaat_mm;
  if(v.zaagmaat_mm && v.zaagmaat_mm.l) return v.zaagmaat_mm.l;
  return null;
}
function dektLumen(v,lm){
  if(lm==null||isNaN(lm)) return true;
  const a=v.lichtstroom_lm||{}; if(a.min==null&&a.max==null) return true;
  return lm >= (a.min??0) && lm <= (a.max??Infinity);
}
/* Filteren: eerst weggooien wat niet kan, dan de kleinste die overblijft. */
function kandidaten(fam,pos){
  const lm = parseGetal(pos.ref.lumen);
  const bestaand = parseGetal(pos.bestaandeZaagmaat);
  return (fam.varianten||[]).filter(v=>{
    if(!dektLumen(v,lm)) return false;
    if(S.project.type==='renovatie' && bestaand){
      // Harde eis: de sierrand moet het bestaande gat afdekken.
      if(v.buitenmaat_mm!=null && v.buitenmaat_mm < bestaand) return false;
    }
    return true;
  }).sort((a,b)=>grootte(a)-grootte(b));
}
function autoKies(fam,pos,vast){
  let k = kandidaten(fam,pos);
  for(const [key] of KENMERKEN){
    if(vast && vast[key]!=null && vast[key]!==''){
      const f = k.filter(v=>String(kenmerkVan(v,key)??'')===String(vast[key]));
      if(f.length) k=f;
    }
  }
  const score=v=>(v.sensor?1:0)+(v.noodverlichting?1:0)+(v.kleur==='wit'?0:1)+(v.driver?0:2);
  return k.sort((a,b)=>grootte(a)-grootte(b)||score(a)-score(b))[0]||null;
}
function parseGetal(s){
  if(s==null) return null;
  const m=String(s).replace(',','.').match(/[\d.]+/);
  return m?parseFloat(m[0]):null;
}
function famById(id){return (DATA?.families||[]).find(f=>f.id===id)||null}
function varByCode(fam,code){return (fam?.varianten||[]).find(v=>v.artikelcode===code)||null}

/* ======================= specificaties uitlezen ======================= */
/* Kopregels van leveranciersbladen: geven context, hebben zelf geen waarde. */
const SECTIE=/^(elektrisch|lichttechniek|controle|bescherming|energie|materiaal|montage|afmeting|verpakking|algemeen|optiek|garantie|akoestiek|overig)/i;

const VELDMAP=[
  {v:'artikelnummer',l:/^(artikelcode|artikelnummer|item ?number|article ?(code|number)|bestelnummer|productcode|sku)$/i},
  {v:'vermogen',   l:/^(systeem\s?wattage|wattage|vermogen|opgenomen vermogen|system power|power|max(imum)? bulb wattage)$/i},
  {v:'lumen',      l:/^(luminous flux|lichtstroom|nuttige lichtstroom|armatuurlichtstroom|lichtstroom armatuur|output)$/i},
  {v:'cct',        l:/^(kleur\s?temperatuur|kleurtemperatuur|colour temperature|color temperature|cct)$/i},
  {v:'dimbaar',    l:/^(type|dimmen|dimming|besturing|sturing)$/i, s:/controle|dim/i},
  {v:'dimbaar',    l:/^(dimbaar|dimbaarheid|dimmable)$/i},
  /* "Type" zonder dimsectie is het soort armatuur, niet de dimwijze.
     Staat na de regel hierboven, zodat die eerst aan bod komt. */
  {v:'type',       l:/^(type|producttype|armatuurtype|product ?type)$/i},
  {v:'_nood',      l:/^(noodlumen|nood lumen|emergency lumen|noodverlichting)/i},
  {v:'_cri',       l:/^(kleurweergave|cri|colour rendering)/i},
  {v:'_ugr',       l:/^ugr/i},
  {v:'_ip',        l:/^(ip\s?(klasse|class|degree|rating|code)|beschermingsgraad|ip)$/i},
  {v:'_ik',        l:/^(ik\s?klasse|ik\s?class|ik)$/i},
  {v:'_diameter',  l:/^diameter/i},
  {v:'_hoogte',    l:/^hoogte/i},
  {v:'_breedte',   l:/^breedte/i},
  {v:'_lengte',    l:/^lengte/i},
  {v:'_cutout',    l:/^(cut-?out|zaagmaat|gatmaat|inbouwopening|inbouwmaat)/i},
  {v:'_diepte',    l:/^inbouwdiepte/i},
  {v:'_kleur',     l:/^(kleur|colou?r)$/i},
  {v:'_montage',   l:/^(montage|mounting)$/i},
  {v:'_bundel',    l:/^(lichtbundel|bundelhoek|beam|stralingshoek)/i},
  {v:'_optiek',    l:/^optiek/i},
  {v:'_levensduur',l:/^levensduur/i},
  {v:'_klasse',    l:/^(isolatieklasse|beschermingsklasse|class|klasse|protection class)$/i},
  {v:'_aansluiting',l:/^aansluiting/i}
];
const LABELS={_nood:'Noodlumen',_cri:'Kleurweergave',_ugr:'UGR',_ip:'IP-klasse',_ik:'IK-klasse',
  _kleur:'Kleur',_montage:'Montage',_bundel:'Lichtbundel',_optiek:'Optiek',_levensduur:'Levensduur',
  _klasse:'Isolatieklasse',_aansluiting:'Aansluiting',_diepte:'Inbouwdiepte',_cutout:'Cut-out'};

/* Een regel met cijfers of vergelijkingstekens is een waarde, geen label —
   anders wordt "UGR<19" voor het label "UGR" aangezien. */
function lijktWaarde(s){return /[\d<>=]/.test(s)||/^(ja|nee|yes|no)$/i.test(s)}

/* Labels komen in het wild met een eenheid of een vraagteken erachter:
   "Maximum bulb wattage (W)", "Dimmable?", "Cut-out (mm)". Voor het opzoeken
   halen we die eraf; de oorspronkelijke tekst blijft in de melding staan. */
function schoonLabel(s){
  return String(s||'').replace(/\s*\([^)]*\)\s*$/,'').replace(/[?:]+$/,'').trim();
}
function isLabel(s){const k=schoonLabel(s); return !lijktWaarde(k) && VELDMAP.some(x=>x.l.test(k))}
function mm(s){const n=parseGetal(s);return n==null?null:Math.round(n)}

/* Geplakte webpagina's brengen hun entiteiten mee: Ra&gt;90, UGR&lt;19. */
function ontHtml(s){
  return String(s||'')
    .replace(/&(lt|gt|amp|quot|apos|nbsp|#39);/g,
      m=>({'&lt;':'<','&gt;':'>','&amp;':'&','&quot;':'"','&apos;':"'",'&#39;':"'",'&nbsp;':' '}[m]))
    .replace(/&#(\d+);/g,(_,n)=>String.fromCharCode(+n));
}

function leesSpecs(tekst){
  const regels=ontHtml(tekst).split(/\r?\n/)
    /* Bestekteksten staan op één regel met komma's ertussen. Alleen knippen
       waar na de komma een nieuw "Label:" begint, anders valt "Reflector, spot"
       uit elkaar en wordt "L70/B50>50,000" halverwege afgekapt. */
    .flatMap(r=>r.split(/,\s*(?=[^,:]{2,40}:)/))
    .map(s=>s.trim()).filter(Boolean);
  const uit={}, herkend=[], onbekend=[];
  let sectie='';
  for(let i=0;i<regels.length;i++){
    let label=regels[i], waarde=null;

    /* Kopregel van een bestektekst: de omschrijving van het armatuur zelf. */
    if(i===0 && !label.includes(':') && label.length>15 && /[a-z]/i.test(label) && !SECTIE.test(label)){
      uit.omschrijving=label; herkend.push({label:'Omschrijving',waarde:label,veld:'omschrijving',sectie});
      continue;
    }

    /* "Groep: Veld: waarde" — de bestektekst zet de groepsnaam ervoor.
       Groep onthouden en verder lezen alsof hij er niet stond. */
    const groep=label.match(/^([^:]{2,40}):\s*(.+:.+)$/);
    if(groep && SECTIE.test(groep[1].trim())){ sectie=groep[1].trim(); label=groep[2].trim(); }

    /* "Label: waarde" op één regel — alleen splitsen als het linkerdeel echt een label is */
    const d=label.indexOf(':');
    if(d>0 && d<40 && isLabel(label.slice(0,d).trim())){
      waarde=label.slice(d+1).trim(); label=label.slice(0,d).trim();
    }
    /* kopregel: onthouden en niets consumeren */
    if(!waarde && SECTIE.test(label) && !/\d/.test(label) && label.length<40 && !isLabel(label)){
      sectie=label; continue;
    }
    const m=(waarde!=null || !lijktWaarde(label))
      ? VELDMAP.find(x=>x.l.test(schoonLabel(label)) && (!x.s || x.s.test(sectie))) : null;
    if(!m){ onbekend.push(label); continue; }
    if(waarde==null){
      const volg=regels[i+1];
      if(volg && !isLabel(volg) && !SECTIE.test(volg)){ waarde=volg; i++; }
    }
    if(waarde==null){ onbekend.push(label); continue; }
    /* Staat de eenheid in het label en is de waarde een kaal getal, dan hoort
       hij erbij: "Maximum bulb wattage (W)" met "60" wordt 60W. */
    const eenheid=(label.match(/\(([^)]{1,4})\)\s*$/)||[])[1];
    if(eenheid && /^[A-Za-z°%]+$/.test(eenheid) && /^-?\d+([.,]\d+)?$/.test(waarde.trim()))
      waarde=waarde.trim()+eenheid;
    if(uit[m.v]==null){ uit[m.v]=waarde; herkend.push({label,waarde,veld:m.v,sectie}); }
  }
  return {uit,herkend,onbekend};
}

/* Vertaal de uitgelezen waarden naar de velden van het vergelijkingsblad. */
function naarBladvelden(u){
  const r={};
  if(u.omschrijving)  r.omschrijving=u.omschrijving;
  if(u.artikelnummer) r.artikelnummer=u.artikelnummer;
  if(u.type)     r.type=u.type;
  if(u.vermogen) r.vermogen=u.vermogen;
  if(u.lumen)    r.lumen=u.lumen;
  if(u.cct)      r.cct=u.cct;
  /* Alleen "Ja" zeggen als de leverancier dat zegt of een dimwijze noemt.
     Staat er iets anders, dan nemen we het over zoals het er staat: bij
     "Driver 350mA apart te bestellen" is "Ja" een bewering die er niet staat. */
  if(u.dimbaar){
    const t=u.dimbaar.trim();
    const zonderJa=t.replace(/^(ja|yes)[,:]?\s*/i,'');
    r.dimbaar = /^(nee|no)\b|niet dimbaar|non-?dim|aan\/uit|on\/off|\bgeen\b/i.test(t) ? 'Nee'
      : /^(ja|yes)\b/i.test(t) ? (zonderJa ? 'Ja — '+zonderJa : 'Ja')
      : /dali|1-?10|0-?10\s?v|push|fase|phase|triac|casambi|dimbaar|dimming/i.test(t) ? 'Ja — '+t
      : t;
  }
  const maten=[];
  if(u._diameter) maten.push('Ø'+mm(u._diameter));
  else if(u._lengte&&u._breedte) maten.push(mm(u._lengte)+'×'+mm(u._breedte));
  if(u._hoogte) maten.push('H'+mm(u._hoogte));
  let a=maten.join(' × ');
  if(u._cutout) a+=(a?' — ':'')+'cut-out Ø'+mm(u._cutout);
  if(u._diepte) a+=(a?', ':'')+'inbouwdiepte '+mm(u._diepte)+'mm';
  if(a) r.afmetingen=a;
  return r;
}
function bereik(o,eh){
  if(!o) return '';
  const a=o.min,b=o.max;
  if(a==null&&b==null) return '';
  if(a==null) return 'max. '+b+eh;
  if(b==null||a===b) return a+eh;
  return a+'-'+b+eh;
}
function onzeWaarden(fam,v){
  if(!fam||!v) return {};
  const d={
    leverancier:'Pragmalux / Distrilight',
    type:fam.naam,
    artikelnummer:v.artikelcode,
    omschrijving:v.omschrijving||'',
    toepassing:'',
    vermogen:bereik(v.vermogen_w,'W'),
    cct:(fam.cct||[]).join('-')+(fam.cct?'K':''),
    lumen:bereik(v.lichtstroom_lm,'lm'),
    dimbaar: v.dimprotocol==null ? '' : (v.dimprotocol==='geen'?'Nee':v.dimprotocol.toUpperCase()),
    afmetingen: v.buitenmaat_mm ? ('Ø'+v.buitenmaat_mm+(zaagmaatVan(v)?' — zaagmaat Ø'+zaagmaatVan(v):''))
      : v.afmetingen_mm ? [v.afmetingen_mm.l,v.afmetingen_mm.b,v.afmetingen_mm.h].filter(Boolean).join('×')+'mm'
      : ''
  };
  if(v.vermogen_w && v.vermogen_w.min==null && v.vermogen_w.opmerking)
    d.vermogen='tot '+v.vermogen_w.max+'W';
  return d;
}

  const ta=el('textarea'); ta.className='paste-ta'; ta.value=st.tekst;
  ta.placeholder='Plak hier de specificaties van het armatuur van de installateur…';

        rij.append(el('span','paste-veld',(REF_VELDEN.find(x=>x[0]===k)||[,k])[1]), el('span','paste-waarde',v));
        tab.append(rij);
      });
      const rest=r.herkend.filter(h=>h.veld.startsWith('_'));

        const s=el('div','paste-rij');
        s.append(el('span','paste-waarde',rest.map(h=>(LABELS[h.veld]||h.label)+': '+h.waarde).join(' · ')));
        tab.append(s);
      }
      if(r.uit._nood) tab.append(el('div','hint warn',
        'Deze referentie heeft noodverlichting ('+r.uit._nood+'). Kies aan onze kant een variant met noodmodule of splits de positie.'));
      if(r.uit._cutout) tab.append(el('div','hint',
        'Cut-out Ø'+mm(r.uit._cutout)+' mm wordt overgenomen als bestaand gat voor de renovatiecontrole.'));
      if(r.onbekend.length){
        const d=document.createElement('details'); d.className='paste-onb';
        const sm=document.createElement('summary'); sm.textContent=r.onbekend.length+' regel(s) niet herkend';
        d.append(sm, el('div','paste-waarde',r.onbekend.join(' · '))); tab.append(d);

      const ok=el('button','pill solid','Invullen in het blad');
      ok.onclick=()=>{

        st.open=false; st.res=null;
        const fam=famById(p.familieId);

        render();

    }
    box.append(tab);

}

/* ======================= foto's ======================= */
/* Grens waarboven verkleind wordt. 1000 px is op een halve A4-breedte nog
   ruim 250 dpi, en houdt het projectbestand hanteerbaar. */
const FOTO_MAX=1000;

/* Leest een bestand als afbeelding en verkleint hem. Het resultaat is een
   data-URI: die gaat mee in het projectbestand en straks in de PDF, terwijl
   een pad naar de schijf van de gebruiker dat niet doet. */
function leesAfbeelding(bestand, klaar){
  if(!bestand) return;
  if(!/^image\//.test(bestand.type||'')){ alert('Kies een afbeelding (jpg, png of webp).'); return; }
  const lezer=new FileReader();
  lezer.onerror=()=>alert('Kan dit bestand niet lezen.');
  lezer.onload=()=>{
    const img=new Image();
    img.onerror=()=>alert('Deze afbeelding kan niet worden getoond.');
    img.onload=()=>{
      const grootste=Math.max(img.width,img.height);
      if(grootste<=FOTO_MAX && String(lezer.result).length<400000){ klaar(lezer.result); return; }
      const schaal=Math.min(1,FOTO_MAX/grootste);
      const c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*schaal));
      c.height=Math.max(1,Math.round(img.height*schaal));
      const ctx=c.getContext('2d');
      /* Productfoto's in png hebben vaak een doorzichtige achtergrond; die
         willen we houden. Jpeg kan dat niet, dus daar zetten we wit onder. */
      const alsPng = bestand.type==='image/png';
      if(!alsPng){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,c.width,c.height); }
      ctx.drawImage(img,0,0,c.width,c.height);
      try{ klaar(alsPng ? c.toDataURL('image/png') : c.toDataURL('image/jpeg',0.82)); }
      catch(err){ klaar(lezer.result); }   /* verkleinen mislukt: dan maar op ware grootte */
    };
    img.src=lezer.result;
  };
  lezer.readAsDataURL(bestand);
}

/* Onze eigen foto komt uit de data: per variant, anders per familie. Het mag
   een pad zijn (merk/armaturen/sigma-g2.jpg) of een data-URI. */
function onzeFoto(fam,v){ return (v&&v.foto) || (fam&&fam.foto) || ''; }

/* Welk fotovak Ctrl+V vult. Met twee vakken moet dat aanwijsbaar zijn; je
   kiest het door op een vak te klikken. Standaard is dat de installateur,
   want dat is de foto die per positie altijd binnenkomt. */
let plakDoel='fotoRef';

/* Eén component voor beide vakken. terugval is de foto uit de productdata:
   die staat er zolang er niets ingeladen is. */
function fotoVak(p, sleutel, opties){
  const cel=el('div','cel foto-cel');
  const kiezer=document.createElement('input');
  kiezer.type='file'; kiezer.accept='image/*'; kiezer.className='hidden';
  const vak=el('div','fotovak'); vak.tabIndex=0;
  const knoppen=el('div','foto-knoppen');
  cel.append(vak,knoppen,kiezer);

  const terugval=opties.terugval||'';
  const zet=uri=>{ p[sleutel]=uri; render(); };

  function teken(){
    vak.innerHTML=''; knoppen.innerHTML='';
    vak.classList.toggle('doel', plakDoel===sleutel);
    if(plakDoel===sleutel) vak.append(el('div','fotovak-doelmerk','Ctrl+V'));

    const eigen=p[sleutel];
    const bron=eigen||terugval;
    if(bron){
      vak.classList.add('gevuld');
      const img=document.createElement('img');
      img.src=bron; img.alt=opties.uitleg;
      img.onerror=()=>{ vak.classList.remove('gevuld');
        vak.append(el('div','fotovak-hoe','Foto niet gevonden: '+bron)); };
      vak.append(img);
      if(!eigen) vak.append(el('div','fotovak-bron','uit de productdata'));
      const vervang=el('button','pill ghost', eigen?'Vervangen':'Eigen foto');
      vervang.onclick=e=>{ e.stopPropagation(); kiezer.click(); };
      knoppen.append(vervang);
      if(eigen){
        const weg=el('button','pill ghost', terugval?'Terug naar productdata':'Verwijderen');
        weg.onclick=e=>{ e.stopPropagation(); p[sleutel]=''; render(); };
        knoppen.append(weg);
      }
    } else {
      vak.classList.remove('gevuld');
      vak.append(el('div','fotovak-uitleg',opties.uitleg),
                 el('div','fotovak-hoe','klik dit vak aan en druk Ctrl+V · sleep een bestand hierheen'));
      const kies=el('button','pill ghost','Bestand kiezen');
      kies.onclick=e=>{ e.stopPropagation(); kiezer.click(); };
      knoppen.append(kies);
      if(opties.leeguitleg) knoppen.append(el('span','fotovak-bron',opties.leeguitleg));
    }
  }

  kiezer.onchange=e=>{ leesAfbeelding(e.target.files[0],zet); kiezer.value=''; };
  /* Klikken wijst dit vak aan als plakdoel; het bestand kiezen doe je met de
     knop eronder. Anders opent er een bestandsvenster als je alleen wilt
     aanwijzen waar je plakt. */
  vak.onclick=()=>{ if(plakDoel!==sleutel){ plakDoel=sleutel; render(); } };
  vak.addEventListener('focus',()=>{ if(plakDoel!==sleutel){ plakDoel=sleutel; render(); } });
  vak.addEventListener('keydown',e=>{
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); kiezer.click(); }
  });
  vak.addEventListener('dragover',e=>{ e.preventDefault(); vak.classList.add('sleep'); });
  vak.addEventListener('dragleave',()=>vak.classList.remove('sleep'));
  vak.addEventListener('drop',e=>{
    e.preventDefault(); vak.classList.remove('sleep');
    leesAfbeelding((e.dataTransfer.files||[])[0],zet);
  });

  teken();
  return cel;
}

function huidigeKenmerken(v){
  if(!v) return {};
  const o={}; KENMERKEN.forEach(([k])=>{ const w=kenmerkVan(v,k); if(w!=null&&w!=='') o[k]=w }); return o;
}

/* Zoeken op naam, merk, lijn, armatuurtype en zoektermen. Elk getypt woord moet
   ergens raken, zodat "essence downlight" hetzelfde vindt als "downlight essence".
   Volgorde: naam die ermee begint eerst, dan naam die het bevat, dan de rest. */
function zoekFamilies(term){
  const families=DATA?.families||[];
  const t=String(term||'').trim().toLowerCase();
  if(!t) return families.slice();
  const woorden=t.split(/\s+/);
  const raak=[];
  for(const f of families){
    const naam=String(f.naam||'').toLowerCase();
    const hooiberg=[f.naam,f.merk,f.lijn,f.armatuurtype,...(f.zoektermen||[])]
      .filter(Boolean).join(' ').toLowerCase();
    if(!woorden.every(w=>hooiberg.includes(w))) continue;
    const score = naam.startsWith(t) ? 0
      : naam.includes(t) ? 1
      : (f.zoektermen||[]).some(z=>String(z).toLowerCase().startsWith(t)) ? 2 : 3;
    raak.push([score,f]);
  }
  raak.sort((a,b)=>a[0]-b[0] || String(a[1].naam).localeCompare(String(b[1].naam)));
  return raak.map(x=>x[1]);
}

function familieKiezer(p,fam){
  const doos=el('div','f fam');
  doos.append(el('label','','Onze familie'));
  const inp=document.createElement('input');
  inp.type='text'; inp.autocomplete='off'; inp.spellcheck=false;
  inp.placeholder='typ of kies een familie';
  inp.value=fam?fam.naam:'';
  const lijst=el('div','fam-lijst'); lijst.hidden=true;
  doos.append(inp,lijst);

  let treffers=[], aan=-1;

  function kies(f){
    p.familieId=f?f.id:''; p.artikelcode=''; p.overrides={}; p.handmatig=false;
    if(f){ const k=autoKies(f,p,null); if(k)p.artikelcode=k.artikelcode; }
    render();                       /* bouwt het hele blad opnieuw op */
  }
  function sluit(){ lijst.hidden=true; aan=-1; }
  function merk(){
    [...lijst.children].forEach((n,i)=>n.classList.toggle('aan',i===aan));
    const n=lijst.children[aan]; if(n) n.scrollIntoView({block:'nearest'});
  }
  function open(term){
    treffers=zoekFamilies(term);
    lijst.innerHTML='';
    if(p.familieId){
      const geen=el('div','fam-op leeg'); geen.append(el('b','','— geen familie —'));
      geen.onmousedown=e=>{e.preventDefault();kies(null)};
      lijst.append(geen);
    }
    if(!treffers.length){
      lijst.append(el('div','fam-niets','Geen familie gevonden voor "'+term+'".'));
    }
    treffers.forEach(f=>{
      const r=el('div','fam-op');
      r.append(el('b','',f.naam||f.id));
      const bij=[f.merk,f.armatuurtype,(f.varianten||[]).length+' artikelen'].filter(Boolean);
      r.append(el('span','',bij.join(' · ')));
      /* mousedown, want blur zou de lijst al sluiten voor de klik aankomt */
      r.onmousedown=e=>{e.preventDefault();kies(f)};
      lijst.append(r);
    });
    /* De familie die er nu staat licht op, zodat Enter niets omgooit. */
    const verschuiving = p.familieId ? 1 : 0;
    const huidig = treffers.findIndex(f=>f.id===p.familieId);
    aan = treffers.length ? (huidig>=0?huidig:0)+verschuiving : -1;
    lijst.hidden=false; merk();
  }

  inp.addEventListener('focus',()=>{inp.select();open('')});
  inp.addEventListener('input',()=>open(inp.value));
  inp.addEventListener('blur',()=>{ sluit(); inp.value=fam?fam.naam:''; });
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      if(lijst.hidden){open(inp.value);return}
      const n=lijst.children.length; if(!n) return;
      aan=(aan+(e.key==='ArrowDown'?1:-1)+n)%n; merk();
    } else if(e.key==='Enter'){
      e.preventDefault();
      const n=lijst.children[aan]; if(n) n.dispatchEvent(new MouseEvent('mousedown',{cancelable:true}));
    } else if(e.key==='Escape'){
      sluit(); inp.value=fam?fam.naam:''; inp.blur();
    }
  });
  return doos;
}

function bouwPicker(p,fam,v){
  const box=el('div','picker');

  box.append(familieKiezer(p,fam));

  if(fam){
    /* kenmerkfilters, alleen tonen waar echt keuze is */
    KENMERKEN.forEach(([key,lbl])=>{
      const waarden=sorteerKenmerk(
        [...new Set((fam.varianten||[]).map(x=>kenmerkVan(x,key)).filter(x=>x!=null&&x!==''))]);
      if(waarden.length<2) return;
      const f=el('div','f'); f.append(el('label','',lbl));
      const s=el('select'); s.append(new Option('geen voorkeur',''));
      waarden.forEach(w=>s.append(new Option(
        String(w)==='true'?'ja':String(w)==='false'?'nee':String(w), String(w))));
      const nu = v ? kenmerkVan(v,key) : null;
      s.value = nu!=null ? String(nu) : '';
      s.onchange=()=>{ const vast=huidigeKenmerken(v); vast[key]=s.value||null;
        const n=autoKies(fam,p,vast); if(n){p.artikelcode=n.artikelcode;p.handmatig=false;} render(); };
      f.append(s); box.append(f);
    });

    /* variantkeuze */
    const k=kandidaten(fam,p);
    const vf=el('div','f'); vf.append(el('label','','Gekozen artikel'));
    const vs=el('select'); vs.style.minWidth='330px';
    const lijst = k.length?k:(fam.varianten||[]);
    lijst.forEach(x=>vs.append(new Option(x.artikelcode+'  —  '+kort(x),x.artikelcode)));
    if(v && !lijst.some(x=>x.artikelcode===v.artikelcode)) vs.append(new Option(v.artikelcode+'  —  '+kort(v),v.artikelcode));
    vs.value=p.artikelcode||'';
    vs.onchange=()=>{p.artikelcode=vs.value;p.handmatig=true;p.overrides={};render()};
    vf.append(vs); box.append(vf);

    /* renovatie: bestaande zaagmaat */
    if(S.project.type==='renovatie'){
      const zf=el('div','f xs'); zf.append(el('label','','Bestaand gat Ø'));
      zf.append(invoer(p.bestaandeZaagmaat,x=>{p.bestaandeZaagmaat=x;
        const n=autoKies(fam,p,huidigeKenmerken(v)); if(n&&!p.handmatig)p.artikelcode=n.artikelcode; render()},'mm'));
      box.append(zf);
    }

    /* melding */
    const lm=parseGetal(p.ref.lumen);
    const m=el('div','hint'); m.style.flexBasis='100%';
    if(lm && !k.length){ m.className='hint err';
      m.textContent='Geen variant dekt '+lm+' lm binnen deze familie'+
        (S.project.type==='renovatie'&&p.bestaandeZaagmaat?' bij een bestaand gat van Ø'+p.bestaandeZaagmaat+' mm.':'.')+
        ' Kies een andere familie of pas de eis aan.';
    } else if(p.handmatig){ m.className='hint warn'; m.textContent='Handmatig gekozen — de automatische keuze is overschreven.';
    } else if(lm && k.length){ m.textContent=k.length+' variant(en) dekken '+lm+' lm; de kleinste is gekozen.'; }
    box.append(m);

    /* zaagwerk melden: past het in het bestaande gat, of moet het vergroot? */
    const gat=parseGetal(p.bestaandeZaagmaat), z=v?zaagmaatVan(v):null;
    if(S.project.type==='renovatie' && gat && z!=null){
      const w=el('div','hint'+(z>gat?' warn':'')); w.style.flexBasis='100%';
      w.textContent = z>gat
        ? 'Let op: bestaand gat moet worden vergroot van Ø'+gat+' naar Ø'+z+' mm.'
        : 'Past in het bestaande gat van Ø'+gat+' mm; sierrand Ø'+v.buitenmaat_mm+' dekt af.';
      box.append(w);
    }
  }
  return box;
}
function kort(v){
  const b=[]; if(v.uitvoering)b.push(v.uitvoering); if(v.kleur)b.push(v.kleur);
  if(v.lengte_cm)b.push(v.lengte_cm+'cm'); if(v.maat)b.push(v.maat);
  if(v.buitenmaat_mm)b.push('Ø'+v.buitenmaat_mm);
  const w=wattLabel(v); if(w)b.push(w);
  if(v.lichtstroom_lm)b.push(bereik(v.lichtstroom_lm,'lm'));
  if(v.driver)b.push(v.driver);
  if(v.sensor)b.push('sensor'); if(v.noodverlichting)b.push('nood '+v.noodverlichting);
  return b.join(' · ');
}

/* ======================= PDF =======================
   Zelfde opmaak als de installateur-PDF van de 3-fase railtool: blauwe kopbalk
   met ruitpatroon, huisstijllettertypen, en de lichtgrijze schuine vorm
   rechtsonder. De maten komen daar vandaan, zodat de twee documenten naast
   elkaar als één set ogen.

   pdf-lib, fontkit en merk-data zijn samen ruim vier megabyte. Die worden pas
   opgehaald als er echt een PDF gevraagd wordt; het openen van de tool blijft
   zo net zo snel als eerst. */
const scriptLaad={};
function laadScript(src){
  if(!scriptLaad[src]){
    scriptLaad[src]=new Promise(res=>{
      const s=document.createElement('script');
      s.src=src; s.onload=()=>res(true); s.onerror=()=>res(false);
      document.head.appendChild(s);
    });
  }
  return scriptLaad[src];
}
function b64Bytes(b64){
  const bin=atob(b64), arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return arr;
}
/* De ingesloten lettertypen zijn 8-bits; alleen tekens omzetten die in onze
   teksten voorkomen. Loopt er iets doorheen dat er niet in zit, dan wordt het
   een vraagteken in plaats van een lege pagina. */
function pdfTxt(s){
  s=String(s==null?'':s).replace(/—|–/g,'-').replace(/×/g,'x')
    .replace(/“|”/g,'"').replace(/‘|’/g,"'")
    .replace(/«/g,'"').replace(/»/g,'"').replace(/→/g,'->');
  let o='';
  for(let i=0;i<s.length;i++){ const c=s.charCodeAt(i); o+=String.fromCharCode(c>255?63:c); }
  return o;
}
let pdfSpul=null;
function pdfOnderdelen(){
  if(!pdfSpul){
    pdfSpul=(async()=>{
      await Promise.all([laadScript('vendor/pdf-lib.min.js'),
                         laadScript('vendor/fontkit.umd.min.js'),
                         laadScript('merk/merk-data.js')]);
      if(!window.PDFLib) throw new Error('vendor/pdf-lib.min.js kon niet geladen worden.');
      return {fontkit:window.fontkit||null, fonts:window.MERK_FONTS||{},
              logos:window.MERK_LOGOS||{}, beelden:window.MERK_BEELDEN||{}};
    })();
  }
  return pdfSpul;
}

/* Een afbeelding uit de tool omzetten naar bytes. Wat geplakt of ingeladen is,
   is al een data-URI en kan zo mee. Een pad uit families.json moet eerst
   opgehaald worden; dat lukt niet als de tool vanaf schijf draait (de browser
   staat het uitlezen van zo'n plaatje dan niet toe). Dan melden we dat, in
   plaats van een lege plek in de PDF zonder uitleg. */
function beeldBytes(bron){
  return new Promise(res=>{
    if(!bron) return res(null);
    if(/^data:/.test(bron)){
      const komma=bron.indexOf(','); if(komma<0) return res(null);
      try{ res({bytes:b64Bytes(bron.slice(komma+1))}); }catch(e){ res(null); }
      return;
    }
    const img=new Image();
    img.onerror=()=>res({fout:'niet gevonden: '+bron});
    img.onload=()=>{
      try{
        const c=document.createElement('canvas');
        c.width=img.naturalWidth; c.height=img.naturalHeight;
        c.getContext('2d').drawImage(img,0,0);
        const uri=c.toDataURL('image/png');
        res({bytes:b64Bytes(uri.slice(uri.indexOf(',')+1))});
      }catch(err){
        res({fout:'kan '+bron+' niet insluiten vanaf schijf'});
      }
    };
    img.src=bron;
  });
}

async function bouwPdf(){
  const merk=await pdfOnderdelen();
  const doc=await PDFLib.PDFDocument.create();
  doc.setTitle('Armatuurvergelijking '+(S.project.nr||''));
  doc.setProducer('Distrilight Armatuurvergelijker');

  /* --- lettertypen --- */
  let FONT, eigenKop=false;
  try{
    if(!merk.fontkit || !merk.fonts.regular) throw new Error('huisstijllettertypen niet beschikbaar');
    doc.registerFontkit(merk.fontkit);
    const laad=async(sleutel,terugval)=> merk.fonts[sleutel]
      ? doc.embedFont(b64Bytes(merk.fonts[sleutel]),{subset:true})
      : doc.embedFont(terugval);
    FONT={ reg:  await laad('regular',   PDFLib.StandardFonts.Helvetica),
           bold: await laad('bold',      PDFLib.StandardFonts.HelveticaBold),
           kop:  await laad('dlKopVet',  PDFLib.StandardFonts.HelveticaBold),
           kopL: await laad('dlKopLicht',PDFLib.StandardFonts.Helvetica) };
    eigenKop=!!merk.fonts.dlKopVet;
  }catch(err){
    console.warn('Huisstijllettertypen niet ingesloten, terugval op Helvetica:', err && err.message);
    const reg=await doc.embedFont(PDFLib.StandardFonts.Helvetica);
    const bold=await doc.embedFont(PDFLib.StandardFonts.HelveticaBold);
    FONT={reg,bold,kop:bold,kopL:reg};
  }

  /* --- kleuren en maten, gelijk aan de installateur-PDF --- */
  const C={hoofd:'#0F7ABE', tekst:'#123A5E', lt:'#DCECF8', line:'#C7D9E7',
           grijs:'#5B677E', wit:'#FFFFFF', voet:'#EBEBEC'};
  const W=595,H=842,Mg=40,MB=64,BALK_H=70;
  const KOL_L=105, KOL_B=(W-2*Mg-KOL_L)/2;      /* label, referentie, ons */
  const kolX=[Mg, Mg+KOL_L, Mg+KOL_L+KOL_B];
  const kleurCache={};
  let pg=null, y=Mg;
  const paginas=[];

  function col(v){
    if(kleurCache[v]) return kleurCache[v];
    const h=v.slice(1);
    return (kleurCache[v]=PDFLib.rgb(parseInt(h.substr(0,2),16)/255,
      parseInt(h.substr(2,2),16)/255, parseInt(h.substr(4,2),16)/255));
  }
  function kiesFont(o){ return o.cond ? (o.bold===false?FONT.kopL:FONT.kop) : (o.bold?FONT.bold:FONT.reg); }
  /* y telt vanaf de bovenkant van de pagina; pdf-lib rekent vanaf onder. */
  function text(x,yt,size,str,opt){ opt=opt||{};
    const s=pdfTxt(str), f=kiesFont(opt);
    const hz=(opt.cond && !eigenKop)?84:100, tc=opt.tc||0;
    const w=f.widthOfTextAtSize(s,size)*hz/100 + s.length*tc;
    let xx=x; if(opt.align==='center')xx=x-w/2; else if(opt.align==='right')xx=x-w;
    pg.setFont(f);
    const key=pg.getFont()[1], c=col(opt.color||'#000000');
    pg.pushOperators(
      PDFLib.pushGraphicsState(), PDFLib.beginText(),
      PDFLib.setFontAndSize(key,size),
      PDFLib.setCharacterSqueeze(hz), PDFLib.setCharacterSpacing(tc),
      PDFLib.setFillingRgbColor(c.red,c.green,c.blue),
      PDFLib.setTextMatrix(1,0,0,1,xx,H-yt-size*0.78),
      PDFLib.showText(f.encodeText(s)),
      PDFLib.endText(), PDFLib.popGraphicsState());
    return w;
  }
  function meet(str,size,opt){ opt=opt||{};
    const s=pdfTxt(str), f=kiesFont(opt);
    const hz=(opt.cond && !eigenKop)?84:100;
    return f.widthOfTextAtSize(s,size)*hz/100 + s.length*(opt.tc||0);
  }
  function wrap(s,maxW,size,opt){
    const woorden=String(s==null?'':s).split(/\s+/).filter(Boolean);
    const regels=[]; let cur='';
    woorden.forEach(w=>{
      const kandidaat=cur?cur+' '+w:w;
      if(cur && meet(kandidaat,size,opt)>maxW){ regels.push(cur); cur=w; }
      else cur=kandidaat;
    });
    if(cur) regels.push(cur);
    return regels.length?regels:[''];
  }
  function rect(x,yt,w,h,fill,stroke,lw){
    if(!fill && !stroke) return;
    const o={x, y:H-yt-h, width:w, height:h};
    if(fill) o.color=col(fill);
    if(stroke){ o.borderColor=col(stroke); o.borderWidth=lw||0.8; } else o.borderWidth=0;
    pg.drawRectangle(o);
  }
  function line(x1,y1,x2,y2,lw,kleur){
    pg.drawLine({start:{x:x1,y:H-y1}, end:{x:x2,y:H-y2}, thickness:lw, color:col(kleur)});
  }
  function poly(pts,fill){
    pg.drawSvgPath('M '+pts.map(p=>p[0]+' '+p[1]).join(' L ')+' Z',{x:0,y:H,color:col(fill),borderWidth:0});
  }
  /* De lichtgrijze schuine vorm rechtsonder, zelfde maat als in de andere PDF. */
  function voet(){
    const s=0.6, vH=52*s, vBreed=128*s, vSmal=92*s, vTop=H-vH;
    poly([[W,vTop],[Mg+(vBreed-vSmal),vTop],[Mg,H],[W,H]], C.voet);
  }
  const RUIT = merk.beelden.ruitpatroon
    ? await doc.embedPng(b64Bytes(merk.beelden.ruitpatroon)).catch(()=>null) : null;
  const LOGO = merk.logos.dlLicht
    ? await doc.embedPng(b64Bytes(merk.logos.dlLicht)).catch(()=>null) : null;

  function nieuwePagina(){
    pg=doc.addPage([W,H]); paginas.push(pg); y=Mg;
    rect(0,0,W,BALK_H,C.hoofd);
    if(RUIT){
      const ph=W/(RUIT.width/RUIT.height);
      pg.drawImage(RUIT,{x:0,y:H-ph,width:W,height:ph});
      rect(0,BALK_H,W,H-BALK_H,C.wit);
    }
    text(Mg,22,22,'Armatuurvergelijker',{bold:true,cond:true,color:C.wit});
    const regel=[S.project.nr,S.project.naam,S.project.inst].filter(Boolean).join('  —  ');
    if(regel) text(Mg,50,9,regel,{color:C.lt});
    if(LOGO){
      const lh=26, lb=lh*(LOGO.width/LOGO.height);
      pg.drawImage(LOGO,{x:W-Mg-lb, y:H-24-lh, width:lb, height:lh});
    }
    voet();
    y=BALK_H+34;
  }
  function ruimte(h){ if(y+h>H-MB){ nieuwePagina(); } }

  /* --- de rijen van het vergelijkingsblad --- */
  function scheiding(){ line(Mg,y,W-Mg,y,0.6,C.line); }
  function rij(label, links, rechts, opt){
    opt=opt||{};
    const size=opt.size||8.5;
    const lLinks=wrap(links,KOL_B-12,size), lRechts=wrap(rechts,KOL_B-12,size);
    const hoogte=Math.max(lLinks.length,lRechts.length)*11+9;
    ruimte(hoogte+4);
    text(kolX[0],y+4,8,label,{bold:true,color:C.hoofd});
    lLinks.forEach((r,i)=>text(kolX[1]+6,y+4+i*11,size,r,{color:'#1B2733'}));
    lRechts.forEach((r,i)=>text(kolX[2]+6,y+4+i*11,size,r,{color:'#1B2733'}));
    y+=hoogte; scheiding();
  }

  const posities=S.posities.filter(p=>p);
  if(!posities.length) throw new Error('Er zijn nog geen posities om af te drukken.');

  const meldingen=[];
  for(const p of posities){
    const fam=famById(p.familieId), v=varByCode(fam,p.artikelcode);
    const waarden=onzeWaarden(fam,v);
    nieuwePagina();

    /* kopbalk van het blad */
    rect(Mg,y,W-2*Mg,19,C.hoofd);
    text(kolX[0]+6,y+5,9,'CODE (BESTEK)',{bold:true,cond:true,color:C.wit,tc:.3});
    text(kolX[1]+6,y+4.5,11,p.code||'',{bold:true,cond:true,color:C.wit});
    y+=19;
    text(kolX[1]+6,y+5,7.5,'REFERENTIE INSTALLATEUR',{bold:true,color:C.hoofd,tc:.3});
    text(kolX[2]+6,y+5,7.5,'VOORSTEL DISTRILIGHT',{bold:true,color:C.hoofd,tc:.3});
    y+=17; scheiding();

    /* foto's — de rij vervalt als er aan geen van beide kanten een foto is,
       anders staat er een blok wit van anderhalve decimeter zonder reden */
    const bronnen=[p.fotoRef, p.fotoOns || onzeFoto(fam,v)];
    if(bronnen.some(Boolean)){
      const fotoH=150, boven=y+4;
      ruimte(fotoH+14);
      text(kolX[0],boven,8,'Foto',{bold:true,color:C.hoofd});
      for(let k=0;k<2;k++){
        if(!bronnen[k]) continue;
        const vakX=kolX[k+1]+6, vakB=KOL_B-12;
        const res=await beeldBytes(bronnen[k]);
        if(res && res.bytes){
          let img=null;
          try{ img = res.bytes[0]===0x89 ? await doc.embedPng(res.bytes) : await doc.embedJpg(res.bytes); }
          catch(err){ meldingen.push('Een foto bij positie '+p.code+' kon niet worden ingesloten.'); }
          if(img){
            /* passend in het vak en daarbinnen gecentreerd; y telt van boven,
               pdf-lib van onder, dus de onderkant van het beeld is het midden
               van het vak min de halve beeldhoogte */
            const s=Math.min(vakB/img.width, fotoH/img.height);
            const bw=img.width*s, bh=img.height*s;
            pg.drawImage(img,{x:vakX+(vakB-bw)/2, y:H-boven-fotoH/2-bh/2, width:bw, height:bh});
          }
        } else if(res && res.fout){
          meldingen.push('Positie '+p.code+': foto '+res.fout);
          text(vakX,boven+fotoH/2,8,'(foto niet ingesloten)',{color:C.grijs});
        }
      }
      y=boven+fotoH+8; scheiding();
    }

    /* aantallen */
    const perLaag=(S.project.lagen||[]).map(l=>l+': '+(p.aantallen[l]||0)).join('   ');
    const totaal=(S.project.lagen||[]).reduce((a,l)=>a+(parseInt(p.aantallen[l])||0),0);
    rij('Aantallen', perLaag+(perLaag?'      ':'')+'totaal '+totaal, '');

    /* de velden van het blad */
    REF_VELDEN.forEach(([k,lbl])=>{
      const ov=p.overrides[k];
      rij(lbl, p.ref[k]||'', ov!=null?ov:(waarden[k]||''));
    });
    rij('Opmerkingen', p.ref.opmerking||'', p.opmerking||'');

    /* paginanummer op de grijze vorm */
    text(W-Mg,H-26,8,'pagina '+paginas.length+' van '+posities.length,{align:'right',color:C.hoofd});
  }

  return {bytes: await doc.save(), meldingen};
}

/* --- voorbeeld op het scherm --- */
let pdfUrl=null;
function sluitPdfVoorbeeld(){
  const bg=document.getElementById('pdfPreviewBg');
  if(bg) bg.remove();
  /* De blob is enkele megabytes; niet vrijgeven laat die in het geheugen staan. */
  if(pdfUrl){ URL.revokeObjectURL(pdfUrl); pdfUrl=null; }
}
async function toonPdfVoorbeeld(){
  sluitPdfVoorbeeld();
  const bg=el('div','pdfprev'); bg.id='pdfPreviewBg';
  const kop=el('div','pdfprev-kop');
  kop.append(el('b','','PDF-voorbeeld'));
  const sluit=el('button','pill','Sluiten'); sluit.onclick=sluitPdfVoorbeeld;
  kop.append(sluit); bg.append(kop);
  const bezig=el('div','pdfprev-bezig','Bezig met opmaken...');
  bg.append(bezig);
  document.body.append(bg);
  bg.addEventListener('click',e=>{ if(e.target===bg) sluitPdfVoorbeeld(); });
  document.addEventListener('keydown',function esc(e){
    if(e.key==='Escape'){ sluitPdfVoorbeeld(); document.removeEventListener('keydown',esc); }
  });

  try{
    const {bytes,meldingen}=await bouwPdf();
    bezig.remove();
    if(meldingen.length){
      const m=el('div','pdfprev-melding',[...new Set(meldingen)].join(' · '));
      bg.insertBefore(m,bg.children[1]||null);
    }
    pdfUrl=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    const haal=el('button','pill solid','Downloaden');
    haal.onclick=()=>{ const a=document.createElement('a');
      a.href=pdfUrl; a.download=(S.project.nr||'armatuurvergelijking')+'.pdf'; a.click(); };
    kop.insertBefore(haal,sluit);
    const iframe=document.createElement('iframe');
    iframe.src=pdfUrl; iframe.title='PDF-voorbeeld';
    bg.append(iframe);
  }catch(err){
    bezig.textContent='De PDF kon niet gemaakt worden: '+(err && err.message || err);
    console.error(err);
  }
}
document.getElementById('btnPdf').onclick=toonPdfVoorbeeld;

/* Ctrl+V met een afbeelding op het klembord zet die in het aangewezen fotovak
   van de positie waar je in staat. Dat luistert op de hele pagina: na een
   schermafdruk wil je niet eerst iets hoeven aanklikken. Tekst plakken
   verandert er niets aan - we grijpen alleen in als er echt een afbeelding
   op het klembord staat. */
document.addEventListener('paste',e=>{
  const items=[...(e.clipboardData && e.clipboardData.items || [])];
  const plaatje=items.find(i=>/^image\//.test(i.type));
  if(!plaatje) return;
  const p=S.posities[S.actief];
  if(!p) return;
  e.preventDefault();
  const doel = plakDoel==='fotoOns' ? 'fotoOns' : 'fotoRef';
  leesAfbeelding(plaatje.getAsFile(), uri=>{ p[doel]=uri; render(); });
});

/* start */
if(DATA) dataTag(DATA); else dataTag(null);
S.posities.push(nieuwePositie('A'));
vulProjectVelden(); render();
